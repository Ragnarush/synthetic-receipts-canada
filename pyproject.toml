[project]
name = "synthetic-receipts-canada"
version = "0.1.0"
description = "Synthetic Canadian (Québec-first) receipt images with ground truth, for testing OCR and receipt-field extraction. No personal data."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ragnarush" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "qrcode>=8.0",
]

[project.scripts]
synthetic-receipts-canada = "synthetic_receipts_canada.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
